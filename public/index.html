<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ঔষধ ঘর | পাইকারি ওষুধ অর্ডার</title>

<!-- PWA: installable as an app from Chrome, with the ঔষধ ঘর logo as the app icon -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d9488">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ঔষধ ঘর">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splashScreen" class="splash-screen">
  <img src="/icons/icon-512.png" class="splash-logo" alt="ঔষধ ঘর">
  <div class="splash-title">ঔষধ ঘর</div>
  <div class="splash-tagline">বিশ্বস্ত পাইকারি ওষুধ অর্ডারিং প্ল্যাটফর্ম</div>
</div>

<div class="topbar">
  <div class="brand">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5 3.5 13.5a5 5 0 0 1 7.07-7.07l7 7a5 5 0 0 1-7.07 7.07Z"/><path d="m8.5 8.5 7 7"/></svg>
    </span>
    ঔষধ ঘর
  </div>
  <div style="display:flex; align-items:center; gap:8px;">
    <div class="admin-view-switch hidden" id="adminViewSwitch">
      <button data-mode="admin" type="button">অ্যাডমিন</button>
      <button data-mode="user" type="button">ইউজার</button>
    </div>
    <button class="icon-btn" id="btnLang" title="Language">EN</button>
    <button class="icon-btn" id="btnNotif" aria-label="Notifications">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 4.5 1.5 6 1.5 6h-15S6 12.5 6 8Z"/><path d="M10.5 20a1.8 1.8 0 0 0 3 0"/></svg>
      <span class="badge hidden" id="notifBadge">•</span>
    </button>
    <button class="icon-btn" id="btnCart" aria-label="Cart">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M2.5 3h2l2.2 11.4a2 2 0 0 0 2 1.6h7.4a2 2 0 0 0 2-1.6L20 7H5.2"/></svg>
      <span class="badge hidden" id="cartBadge">0</span>
    </button>
  </div>
</div>

<div class="container" id="app"></div>

<div class="floating-buy-bar hidden" id="floatingBuyBar">
  <div class="fbb-info">
    <span id="fbbCount">0</span> টি পণ্য • <b id="fbbTotal">৳0</b>
  </div>
  <a href="#/cart" class="btn btn-primary btn-sm" id="fbbBtn">এখনই কিনুন</a>
</div>

<div class="bottom-nav" id="bottomNav">
  <a data-view="shop">
    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3.5v-5.5h3V20H17a1 1 0 0 0 1-1v-9"/></svg></span>
    <span data-i18n="nav_home">হোম</span>
  </a>
  <a data-view="products">
    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>
    <span data-i18n="nav_products">সব পণ্য</span>
  </a>
  <a data-view="orders">
    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4.5" width="16" height="15" rx="2"/><path d="M8 4.5V3.2a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1V4.5M8 11h8M8 15h5"/></svg></span>
    <span data-i18n="nav_orders">অর্ডার</span>
  </a>
  <a data-view="cart">
    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M2.5 3h2l2.2 11.4a2 2 0 0 0 2 1.6h7.4a2 2 0 0 0 2-1.6L20 7H5.2"/></svg></span>
    <span data-i18n="nav_cart">কার্ট</span>
  </a>
  <a data-view="profile">
    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.6 3.1-6.5 7-6.5s7 2.9 7 6.5"/></svg></span>
    <span data-i18n="nav_profile">প্রোফাইল</span>
  </a>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
